<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepFake Video Degradation Tool - Starting...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #151a24 0%, #080a0f 100%);
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 420px;
      padding: 32px;
      animation: fadeIn 0.6s ease-out;
    }

    .logo-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin-bottom: 24px;
    }

    .logo-glow {
      position: absolute;
      inset: -10px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.45) 0%, rgba(168, 85, 247, 0.25) 50%, transparent 70%);
      border-radius: 50%;
      filter: blur(14px);
      animation: pulse 2.4s ease-in-out infinite alternate;
    }

    .logo-img {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
      object-fit: cover;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.status {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 28px;
      letter-spacing: 0.01em;
    }

    .progress-bar-track {
      width: 260px;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: -50%;
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, #06b6d4, #8b5cf6, #ec4899);
      border-radius: 999px;
      animation: indeterminate 1.6s ease-in-out infinite;
    }

    .footer-note {
      margin-top: 24px;
      font-size: 11px;
      color: #475569;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }

    @keyframes indeterminate {
      0% {
        left: -50%;
        width: 40%;
      }

      50% {
        left: 30%;
        width: 60%;
      }

      100% {
        left: 100%;
        width: 40%;
      }
    }

    @keyframes pulse {
      0% {
        opacity: 0.5;
        transform: scale(0.95);
      }

      100% {
        opacity: 1;
        transform: scale(1.1);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo-wrapper">
      <div class="logo-glow"></div>
      <img src="../assets/icon.png" alt="Logo" class="logo-img">
    </div>
    <h1>DeepFake Video Degradation Tool</h1>
    <p class="status" id="status-text">Starting background server...</p>
    <div class="progress-bar-track">
      <div class="progress-bar-fill"></div>
    </div>
    <div class="footer-note">Local Desktop Engine &bull; FFmpeg Powered</div>
  </div>

  <script>
    const messages = [
      "Starting local engine...",
      "Connecting to Next.js server...",
      "Verifying FFmpeg services...",
      "Preparing workspace..."
    ];
    let idx = 0;
    setInterval(() => {
      idx = (idx + 1) % messages.length;
      const el = document.getElementById('status-text');
      if (el) el.textContent = messages[idx];
    }, 1500);
  </script>
</body>

</html>
